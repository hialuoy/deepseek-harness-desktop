name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: sync node deps
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 无密码密钥须显式置空，否则 tauri 会交互式索要密码导致 CI 失败
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'DeepSeek Harness v__VERSION__'
          releaseBody: |
            ## DeepSeek Harness v__VERSION__

            ### What's new / 更新内容
            _(Edit this section before publishing the draft.)_

            ### Install / 安装

            | Platform | Recommended |
            |----------|-------------|
            | macOS Apple Silicon | `DeepSeek.Harness___VERSION___aarch64.dmg` |
            | macOS Intel | `DeepSeek.Harness___VERSION___x64.dmg` |
            | Windows | `DeepSeek.Harness___VERSION___x64-setup.exe` or `.msi` |
            | Linux | `.deb` / `.AppImage` / `.rpm` (see Assets below) |

            安装后可在菜单 **帮助 → 检查更新…** 验证 dsh 与桌面应用更新。
            After install, use **Help → Check for Updates…** to verify dsh and app updates.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
