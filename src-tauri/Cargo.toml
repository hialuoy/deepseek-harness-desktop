[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DeepSeek Harness Desktop — Tauri shell (Route A)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sys-locale = "0.3"
reqwest = { version = "0.13", features = ["blocking"] }
